timezone: Asia/Ho_Chi_Minh

quota:
  daily_limit: 10000      # hạn mức mặc định của YouTube Data API v3
  safety_ratio: 0.85      # chỉ dùng tối đa 85% để chừa dư địa
  search_daily_cap: 80    # search.list rất đắt (100 đơn vị/lần), chặn cứng số lần/ngày

discover:
  run_budget_units: 600

crawl:
  run_budget_units: 600          # ngân sách mỗi lần chạy job crawl
  min_poll_interval_min: 30      # video còn trong cửa sổ theo dõi: tối thiểu bao phút mới cào lại
  older_streak_stop: 3           # dừng phân trang khi gặp liên tiếp N comment cũ hơn mốc (chịu được comment ghim)

schedule:
  discover_cron_hour: 6          # giờ VN, chạy tìm video mới mỗi ngày
  crawl_every_min: 30

# Cửa sổ dữ liệu theo đề tài: từ ngày ra mắt đến 4 tuần sau
window_weeks: 4
video_window_before_days: 7      # nhận cả video hands-on đăng trước ra mắt vài ngày

# === ĐIỀN SAU KHI CHỐT MẪU MÁY (mục còn mở #1) ===
models:
  main:
    name: "Iphone 15 Pro max"
    aliases: ["Iphone 15 Pro Max", "Iphone15 prm", "ip15 prm", "ip15 pro max", "Táo 15 pro max", "Táo 15 prm", "15 pro max"]       # cách người ta gọi trong tiêu đề video, có/không dấu đều được
    launch_date: "2023-09-12"    # ngày ra mắt tại VN (YYYY-MM-DD)
  rival:
    name: "Samsung Galaxy S24 Ultra"
    aliases: ["samsung s24", "Samsung Galaxy S24 Ultra", "S24"]
    launch_date: "2024-01-10"

